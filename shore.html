<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shore</title>
<style>
:root{
  --bg:#F6F1E7; --surface:#FFFFFF; --line:#E6DFCF; --line-strong:#D6CBAF;
  --text:#3D4A47; --text-sec:#7A7568; --text-muted:#A69E8C;
  --aqua:#5C9E93; --aqua-deep:#3D4A47; --aqua-tint:#E4F0ED;
  --terra:#C9724F; --terra-deep:#5A2C17; --terra-tint:#F7E4D8;
  --danger:#B3573B;
  --on-solid:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#242220; --surface:#2E2B27; --line:#443F38; --line-strong:#5A5348;
    --text:#F2EDE2; --text-sec:#BDB4A2; --text-muted:#8C8474;
    --aqua:#7FB8AC; --aqua-deep:#E4F0ED; --aqua-tint:#33453F;
    --terra:#E2A07E; --terra-deep:#F7E4D8; --terra-tint:#4A3226;
    --danger:#E2A07E;
    --on-solid:#1C2422;
  }
}
:root[data-theme="dark"]{
  --bg:#242220; --surface:#2E2B27; --line:#443F38; --line-strong:#5A5348;
  --text:#F2EDE2; --text-sec:#BDB4A2; --text-muted:#8C8474;
  --aqua:#7FB8AC; --aqua-deep:#E4F0ED; --aqua-tint:#33453F;
  --terra:#E2A07E; --terra-deep:#F7E4D8; --terra-tint:#4A3226;
  --on-solid:#1C2422;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#app{max-width:460px;margin:0 auto;min-height:100vh;}
header.topbar{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:18px 20px 8px; display:flex; align-items:center; justify-content:space-between;
}
.brand{font-size:17px; font-weight:500; color:var(--aqua-deep);}
.loc-chip{font-size:12px; color:var(--text-sec); cursor:pointer;}
.cart-btn{font-size:12px; color:var(--aqua-deep); background:var(--aqua-tint); border-radius:20px; padding:6px 13px; cursor:pointer; border:none;}
main{padding:8px 20px 100px;}
h1.screen-title{font-size:23px; font-weight:500; margin:8px 0 4px; color:var(--aqua-deep);}
p.screen-sub{font-size:13px; color:var(--text-sec); margin:0 0 18px; line-height:1.5;}
.card{background:var(--surface); border-radius:18px; padding:16px; margin-bottom:12px; cursor:pointer; transition:transform .1s;}
.card:active{transform:scale(0.98);}
.loc-card{display:flex; align-items:center; gap:14px;}
.loc-icon{width:44px; height:44px; border-radius:12px; background:var(--aqua-tint); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.loc-title{font-size:16px; font-weight:500;}
.loc-sub{font-size:12px; color:var(--text-muted); margin-top:2px;}
.drink-card{display:flex; gap:14px; align-items:flex-start;}
.drink-icon{width:56px; height:56px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.drink-title{font-size:17px; font-weight:500;}
.drink-desc{font-size:12px; color:var(--text-muted); margin-top:3px; line-height:1.5;}
.drink-price{font-size:13px; color:var(--text-sec); margin-top:8px;}
.surprise-btn{
  width:100%; background:var(--terra-tint); color:var(--terra-deep); border:none; border-radius:20px;
  padding:12px; font-size:13px; font-weight:500; cursor:pointer; margin-bottom:16px;
}
.section-label{font-size:12px; font-weight:500; color:var(--text-sec); margin:20px 0 10px;}
.pill-row{display:flex; gap:8px; flex-wrap:wrap;}
.pill{
  border:0.5px solid var(--line-strong); border-radius:20px; padding:9px 15px;
  font-size:13px; color:var(--text-sec); cursor:pointer; background:var(--surface);
}
.pill.active{background:var(--aqua); color:var(--on-solid); border-color:var(--aqua);}
.pill.active.shot-on{background:var(--terra); color:var(--on-solid); border-color:var(--terra);}
.pill-delta{font-size:10px; opacity:0.85; margin-left:3px;}
.sticky-bar{
  position:sticky; bottom:0; background:var(--bg); padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  max-width:460px; margin:0 auto;
}
.btn-primary{
  width:100%; background:var(--aqua-deep); color:var(--on-solid); border:none; border-radius:24px;
  padding:15px; font-size:15px; font-weight:500; cursor:pointer;
}
.link-btn{color:var(--aqua); font-size:13px; cursor:pointer; font-weight:500;}
.back-link{font-size:13px; color:var(--text-sec); cursor:pointer; margin-bottom:6px; display:inline-block;}
.cart-item{background:var(--surface); border-radius:16px; padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start;}
.cart-item-icon{width:40px; height:40px; border-radius:10px; flex-shrink:0;}
.cart-item-title{font-size:14px; font-weight:500;}
.cart-item-desc{font-size:11px; color:var(--text-muted); margin-top:3px; line-height:1.5;}
.cart-item-price{font-size:14px; font-weight:500; white-space:nowrap; margin-left:auto;}
.icon-btn{width:26px; height:26px; border-radius:50%; border:0.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-sec); cursor:pointer; flex-shrink:0;}
.item-col{flex:1;}
.item-actions{display:flex; gap:8px; margin-top:8px;}
.totals{margin-top:18px; padding-top:12px; border-top:0.5px solid var(--line);}
.total-row{display:flex; justify-content:space-between; font-size:13px; color:var(--text-sec); padding:3px 0;}
.total-row.grand{font-size:17px; font-weight:500; color:var(--text); padding-top:6px;}
.field{margin-bottom:14px;}
.field label{font-size:12px; color:var(--text-sec); display:block; margin-bottom:6px;}
.field input{
  width:100%; padding:12px 14px; border:0.5px solid var(--line-strong); border-radius:14px;
  font-size:14px; background:var(--surface); color:var(--text);
}
.field input:focus{outline:none; border-color:var(--aqua); box-shadow:0 0 0 2px var(--aqua-tint);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.error-text{font-size:12px; color:var(--danger); margin-top:5px;}
.status-wrap{text-align:center; padding:34px 10px 10px;}
.status-steps{display:flex; justify-content:center; gap:12px; margin:22px 0;}
.status-dot{width:8px; height:8px; border-radius:50%; background:var(--line-strong); transition:background 0.3s;}
.status-dot.active{background:var(--aqua);}
.status-card{border-radius:20px; background:var(--surface); padding:30px 18px;}
.status-headline{font-size:20px; font-weight:500; margin-bottom:6px; color:var(--aqua-deep);}
.status-sub{font-size:13px; color:var(--text-sec);}
.status-card.ready{background:var(--terra-tint);}
.status-card.ready .status-headline{color:var(--terra-deep);}
.order-id{font-size:12px; color:var(--text-muted); margin-top:18px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
var DRINKS = [
  {id:'brewed', name:'Brewed', price:3.50, desc:'Drip coffee, full-bodied and easy to sip on the sand', milk:true, tint:'#E7D9C4', fg:'#7A5A32'},
  {id:'espresso', name:'Espresso', price:2.75, desc:'A bold little shot, no fuss', milk:false, tint:'#D9CFC4', fg:'#4A3A2C'},
  {id:'cappuccino', name:'Cappuccino', price:5.00, desc:'Espresso with steamed milk and foam', milk:true, tint:'#E4F0ED', fg:'#3D4A47'}
];
var SIZES = [{id:'normale',label:'Normale',delta:0},{id:'gigante',label:'Gigante',delta:1.5},{id:'troppo',label:'Troppo',delta:2.0}];
var MILKS = ['Whole','Oat','Almond','Non-fat','None'];
var SWEET = ['None','Sugar','Honey','Vanilla syrup'];
var TEMPS = ['Hot','Iced'];
var SHOT_PRICE = 0.75;
var LOCATIONS = [
  {name:'Beachside — Original', sub:'12 Shoreline Ave'},
  {name:'Harbor Walk', sub:'88 Marina Blvd'},
  {name:'Palm Grove', sub:'204 Palm St'},
  {name:'Sunset Pier', sub:'1 Pier Rd'}
];

var S = { screen:'location', location:null, cart:[], config:null, editIndex:null, statusStage:0 };

function money(n){ return '$' + n.toFixed(2); }
function calcPrice(cfg){
  var d = DRINKS.find(function(x){return x.id===cfg.drinkId;});
  var sz = SIZES.find(function(x){return x.id===cfg.size;});
  return d.price + sz.delta + (cfg.shot ? SHOT_PRICE : 0);
}
function go(screen){ S.screen = screen; render(); window.scrollTo(0,0); }
function selectLocation(name){ S.location = name; go('menu'); }

function defaultConfig(drinkId){
  var d = DRINKS.find(function(x){return x.id===drinkId;});
  return { drinkId:drinkId, size:'normale', milk: d.milk ? 'Whole' : 'None', sweet:'None', temp:'Hot', shot:false };
}
function openDrink(drinkId, editIndex){
  if(editIndex !== undefined && editIndex !== null){
    S.config = Object.assign({}, S.cart[editIndex]);
    S.editIndex = editIndex;
  } else {
    S.config = defaultConfig(drinkId);
    S.editIndex = null;
  }
  go('detail');
}
function surpriseMe(){
  var d = DRINKS[Math.floor(Math.random()*DRINKS.length)];
  var cfg = defaultConfig(d.id);
  var szs = SIZES.map(function(s){return s.id;});
  cfg.size = szs[Math.floor(Math.random()*szs.length)];
  cfg.temp = TEMPS[Math.floor(Math.random()*TEMPS.length)];
  if(d.milk) cfg.milk = MILKS[Math.floor(Math.random()*MILKS.length)];
  S.config = cfg; S.editIndex = null;
  go('detail');
}

function setCfg(field, value){ S.config[field] = value; render(); }
function toggleShot(){ S.config.shot = !S.config.shot; render(); }
function addToOrder(){
  var item = Object.assign({}, S.config);
  item.price = calcPrice(item);
  if(S.editIndex !== null){ S.cart[S.editIndex] = item; } else { S.cart.push(item); }
  S.editIndex = null;
  go('menu');
}
function removeItem(i){ S.cart.splice(i,1); render(); }
function editItem(i){ openDrink(S.cart[i].drinkId, i); }
function subtotal(){ return S.cart.reduce(function(sum,i){return sum + i.price;},0); }
function tax(){ return subtotal() * 0.08; }
function grandTotal(){ return subtotal() + tax(); }

var paymentErrors = {};
function validatePayment(){
  paymentErrors = {};
  var card = document.getElementById('pf-card'), exp = document.getElementById('pf-exp'),
      cvv = document.getElementById('pf-cvv'), name = document.getElementById('pf-name');
  if(!card.value || card.value.replace(/\s/g,'').length < 12) paymentErrors.card = 'Enter a valid card number';
  if(!exp.value) paymentErrors.exp = 'Required';
  if(!cvv.value || cvv.value.length < 3) paymentErrors.cvv = 'Required';
  if(!name.value.trim()) paymentErrors.name = 'Required';
  if(Object.keys(paymentErrors).length){ render(); return; }
  placeOrder();
}
function placeOrder(){
  S.orderNumber = Math.floor(1000 + Math.random()*9000);
  S.statusStage = 0;
  go('status');
  setTimeout(function(){ if(S.screen==='status'){ S.statusStage = 1; render(); } }, 2200);
  setTimeout(function(){ if(S.screen==='status'){ S.statusStage = 2; render(); } }, 5200);
}
function newOrder(){ S.cart=[]; S.location=null; S.statusStage=0; go('location'); }
function cartBadge(){ return S.cart.length ? '<button class="cart-btn" onclick="go(\'cart\')">Order · ' + S.cart.length + '</button>' : '<span></span>'; }
function topbar(showLocation){
  var loc = showLocation ? '<span class="loc-chip" onclick="go(\'location\')">' + S.location + '</span>' : '<span></span>';
  return '<header class="topbar"><span class="brand">Tideline</span>' + cartBadge() + '</header>' +
    (showLocation ? '<div style="max-width:460px;margin:0 auto;padding:0 20px;">' + loc + '</div>' : '');
}
function cupIcon(fg, size){
  size = size || 24;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z" stroke="'+fg+'" stroke-width="1.6"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17" stroke="'+fg+'" stroke-width="1.6"/><path d="M8 4c0 1-1 1-1 2M12 4c0 1-1 1-1 2" stroke="'+fg+'" stroke-width="1.4" stroke-linecap="round"/></svg>';
}

function renderLocation(){
  var cards = LOCATIONS.map(function(l){
    return '<div class="card loc-card" onclick="selectLocation(\'' + l.name + '\')">' +
      '<div class="loc-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" stroke="#3D4A47" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.2" stroke="#3D4A47" stroke-width="1.6"/></svg></div>' +
      '<div><div class="loc-title">' + l.name + '</div><div class="loc-sub">' + l.sub + '</div></div></div>';
  }).join('');
  return '<header class="topbar"><span class="brand">Tideline</span><span></span></header>' +
    '<main><h1 class="screen-title">Where are you headed?</h1><p class="screen-sub">Pick a spot — we\'ll get your order ready there.</p>' + cards + '</main>';
}

function renderMenu(){
  var cards = DRINKS.map(function(d){
    return '<div class="card drink-card" onclick="openDrink(\'' + d.id + '\')">' +
      '<div class="drink-icon" style="background:' + d.tint + '">' + cupIcon(d.fg, 26) + '</div>' +
      '<div><div class="drink-title">' + d.name + '</div><div class="drink-desc">' + d.desc + '</div><div class="drink-price">from ' + money(d.price) + '</div></div></div>';
  }).join('');
  var checkoutBar = S.cart.length ?
    '<div class="sticky-bar"><button class="btn-primary" onclick="go(\'cart\')">Proceed to checkout — ' + money(grandTotal()) + '</button></div>' : '';
  return topbar(true) +
    '<main><h1 class="screen-title">Take your pick</h1><p class="screen-sub">Three drinks, made your way.</p>' +
    '<button class="surprise-btn" onclick="surpriseMe()">✦ Surprise me</button>' + cards + '</main>' + checkoutBar;
}

function renderDetail(){
  var cfg = S.config;
  var d = DRINKS.find(function(x){return x.id===cfg.drinkId;});
  var price = calcPrice(cfg);
  var sizeHtml = SIZES.map(function(s){
    return '<div class="pill ' + (cfg.size===s.id?'active':'') + '" onclick="setCfg(\'size\',\'' + s.id + '\')">' + s.label + (s.delta?'<span class="pill-delta">+'+money(s.delta)+'</span>':'') + '</div>';
  }).join('');
  var milkHtml = d.milk ? MILKS.map(function(m){
    return '<div class="pill ' + (cfg.milk===m?'active':'') + '" onclick="setCfg(\'milk\',\'' + m + '\')">' + m + '</div>';
  }).join('') : '';
  var sweetHtml = SWEET.map(function(sw){
    return '<div class="pill ' + (cfg.sweet===sw?'active':'') + '" onclick="setCfg(\'sweet\',\'' + sw + '\')">' + sw + '</div>';
  }).join('');
  var tempHtml = TEMPS.map(function(t){
    return '<div class="pill ' + (cfg.temp===t?'active':'') + '" onclick="setCfg(\'temp\',\'' + t + '\')">' + t + '</div>';
  }).join('');
  return topbar(false) +
    '<main><span class="back-link" onclick="go(\'menu\')">‹ Back</span>' +
    '<div style="width:72px;height:72px;border-radius:18px;background:' + d.tint + ';display:flex;align-items:center;justify-content:center;margin-bottom:12px;">' + cupIcon(d.fg,34) + '</div>' +
    '<h1 class="screen-title">' + d.name + '</h1><p class="screen-sub">' + d.desc + '</p>' +
    '<div class="section-label">Size</div><div class="pill-row">' + sizeHtml + '</div>' +
    (d.milk ? '<div class="section-label">Milk</div><div class="pill-row">' + milkHtml + '</div>' : '') +
    '<div class="section-label">Sweetener</div><div class="pill-row">' + sweetHtml + '</div>' +
    '<div class="section-label">Temperature</div><div class="pill-row">' + tempHtml + '</div>' +
    '<div class="section-label">Extra</div><div class="pill-row"><div class="pill ' + (cfg.shot?'active shot-on':'') + '" onclick="toggleShot()">Extra shot <span class="pill-delta">+' + money(SHOT_PRICE) + '</span></div></div>' +
    '</main>' +
    '<div class="sticky-bar"><button class="btn-primary" onclick="addToOrder()">' + (S.editIndex!==null?'Update — ':'Add to order — ') + money(price) + '</button></div>';
}

function renderCart(){
  if(!S.cart.length){
    return topbar(true) + '<main><h1 class="screen-title">Your order</h1><p class="screen-sub">Nothing here yet.</p>' +
      '<span class="link-btn" onclick="go(\'menu\')">Browse the menu →</span></main>';
  }
  var items = S.cart.map(function(item,i){
    var d = DRINKS.find(function(x){return x.id===item.drinkId;});
    var sz = SIZES.find(function(x){return x.id===item.size;});
    var descParts = [sz.label, item.milk, item.sweet!=='None'?item.sweet:null, item.temp, item.shot?'Extra shot':null].filter(Boolean);
    return '<div class="cart-item"><div class="cart-item-icon" style="background:' + d.tint + ';display:flex;align-items:center;justify-content:center;">' + cupIcon(d.fg,18) + '</div>' +
      '<div class="item-col"><div class="cart-item-title">' + d.name + '</div><div class="cart-item-desc">' + descParts.join(', ') + '</div>' +
      '<div class="item-actions"><span class="icon-btn" onclick="editItem(' + i + ')" title="Edit">✎</span><span class="icon-btn" onclick="removeItem(' + i + ')" title="Remove">✕</span></div></div>' +
      '<div class="cart-item-price">' + money(item.price) + '</div></div>';
  }).join('');
  return topbar(true) +
    '<main><h1 class="screen-title">Your order</h1>' + items +
    '<span class="link-btn" onclick="go(\'menu\')">+ Add another drink</span>' +
    '<div class="totals">' +
    '<div class="total-row"><span>Subtotal</span><span>' + money(subtotal()) + '</span></div>' +
    '<div class="total-row"><span>Tax</span><span>' + money(tax()) + '</span></div>' +
    '<div class="total-row grand"><span>Total</span><span>' + money(grandTotal()) + '</span></div>' +
    '</div></main>' +
    '<div class="sticky-bar"><button class="btn-primary" onclick="go(\'payment\')">Proceed to payment</button></div>';
}

function renderPayment(){
  var e = paymentErrors;
  return topbar(false) +
    '<main><span class="back-link" onclick="go(\'cart\')">‹ Order</span>' +
    '<h1 class="screen-title">Payment</h1><p class="screen-sub">Total due: ' + money(grandTotal()) + '</p>' +
    '<div class="field"><label>Card number</label><input id="pf-card" placeholder="1234 5678 9012 3456" inputmode="numeric">' + (e.card?'<div class="error-text">'+e.card+'</div>':'') + '</div>' +
    '<div class="field-row">' +
    '<div class="field"><label>Expiry</label><input id="pf-exp" placeholder="MM/YY">' + (e.exp?'<div class="error-text">'+e.exp+'</div>':'') + '</div>' +
    '<div class="field"><label>CVV</label><input id="pf-cvv" placeholder="123" inputmode="numeric">' + (e.cvv?'<div class="error-text">'+e.cvv+'</div>':'') + '</div>' +
    '</div>' +
    '<div class="field"><label>Name on card</label><input id="pf-name" placeholder="Alex Rivera">' + (e.name?'<div class="error-text">'+e.name+'</div>':'') + '</div>' +
    '<p class="screen-sub">Pickup at ' + S.location + '.</p></main>' +
    '<div class="sticky-bar"><button class="btn-primary" onclick="placeOrder()">Place order</button></div>';
}

function renderStatus(){
  var labels = ['Order received', 'Making your order', 'Ready for pickup'];
  var subs = ['We\'ve got it — thanks!', 'Your drinks are being made.', 'Come grab it at the counter.'];
  var stage = S.statusStage;
  var dots = [0,1,2].map(function(i){ return '<div class="status-dot ' + (i<=stage?'active':'') + '"></div>'; }).join('');
  return topbar(false) +
    '<main><div class="status-wrap">' +
    '<div class="status-steps">' + dots + '</div>' +
    '<div class="status-card ' + (stage===2?'ready':'') + '">' +
    '<div class="status-headline">' + labels[stage] + '</div><div class="status-sub">' + subs[stage] + '</div></div>' +
    '<div class="order-id">Order #' + S.orderNumber + ' · ' + S.location + '</div>' +
    (stage===2 ? '<div style="margin-top:20px;"><span class="link-btn" onclick="newOrder()">Start a new order</span></div>' : '') +
    '</div></main>';
}

function render(){
  var html = '';
  if(S.screen==='location') html = renderLocation();
  else if(S.screen==='menu') html = renderMenu();
  else if(S.screen==='detail') html = renderDetail();
  else if(S.screen==='cart') html = renderCart();
  else if(S.screen==='payment') html = renderPayment();
  else if(S.screen==='status') html = renderStatus();
  document.getElementById('app').innerHTML = html;
}
render();
</script>
</body>
</html>
